name: Deploy Website to Cloudflare Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy-cloudflare-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Cloudflare Secrets
        id: check_cf
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "ready=true" >> $GITHUB_OUTPUT
          else
            echo "ready=false" >> $GITHUB_OUTPUT
            echo "⚠️ Chưa cấu hình CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID trong GitHub Secrets; bỏ qua bước đẩy Cloudflare Pages."
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --prefer-offline || npm install --no-save

      - name: Sync Pricing & Build Minified Assets
        run: |
          npm run sync:pricing
          npm run fix:html
          npm run build:css
          npm run build:js
          npm run audit:repo

      - name: Stamp Static Asset Version
        run: |
          export VERSION="${GITHUB_SHA::8}"
          python3 - << 'PY'
          import os, re
          from pathlib import Path
          version = os.environ["VERSION"]
          for f in Path(".").rglob("*.html"):
              if ".git" in f.parts or "node_modules" in f.parts:
                  continue
              txt = f.read_text(encoding="utf-8")
              txt = re.sub(r'(\.(?:css|js))\?v=VERSION', rf'\1?v={version}', txt)
              f.write_text(txt, encoding="utf-8")
          sw = Path("sw.js")
          if sw.exists():
              sw.write_text(re.sub(r'fpt-telecom-v\d+|fpt-telecom-VERSION', f'fpt-telecom-{version}', sw.read_text(encoding="utf-8")), encoding="utf-8")
          PY

      - name: Publish to Cloudflare Pages
        if: steps.check_cf.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=fpttelecomvn --branch=main
